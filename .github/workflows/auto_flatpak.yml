on:
  workflow_dispatch:
name: Build Flatpak
permissions:
  contents: write
jobs:
  flatpak:
    name: "Flatpak"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
    - uses: actions/checkout@v4
    - name: Check FE-Xico Flatpak manifest
      run: |
        test -f .flatpak-manifest.json || { echo '::error::Flatpak manifest is not yet included in FE-Xico Updater'; exit 1; }
    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: FE-Xico-Updater.flatpak
        manifest-path: .flatpak-manifest.json
        cache-key: flatpak-builder-${{ github.sha }}
    - name: Upload Flatpak artifact
      uses: actions/upload-artifact@v4
      with:
        name: FE-Xico-Updater.flatpak
        path: FE-Xico-Updater.flatpak
    - name: Attach Flatpak to release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: FE-Xico-Updater.flatpak
