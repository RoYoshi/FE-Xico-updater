name: Native FE-XicoOS updater tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/native-bootc-reliability]
permissions:
  contents: read
jobs:
  native:
    name: Native updater (Fedora ${{ matrix.fedora }})
    runs-on: ubuntu-24.04
    container: fedora:${{ matrix.fedora }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # FE-XicoOS builds the updater on Fedora 45; 44 stays covered as its fallback.
        fedora: [44, 45]
    steps:
      - name: Bootstrap Git for recursive checkout
        timeout-minutes: 5
        run: dnf5 -y install git
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Fedora Qt/KDE build and runtime dependencies
        timeout-minutes: 12
        run: |
          dnf5 -y install cmake ninja-build gcc-c++ git python3 extra-cmake-modules pkgconf-pkg-config gettext mesa-libGLU-devel SDL3-devel qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel kf6-kirigami-devel kf6-kirigami-addons-devel kf6-kcoreaddons-devel kf6-kconfig-devel kf6-kcolorscheme-devel kf6-ki18n-devel kf6-kiconthemes-devel kf6-qqc2-desktop-style dbus-daemon
      # Failures are also posted as annotations, which stay readable through
      # the Checks API when raw job logs are not.
      - name: Configure and compile native application and tests
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX=/usr -D_USE_XDG_CONFIG=ON -D_INCLUDE_SUBMODULES=ON -DBUILD_TESTING=ON 2>&1 | tee configure.log
          if ! cmake --build build --parallel 4 2>&1 | tee build.log; then
            grep -E "error:|Error " build.log | head -n 25 | while IFS= read -r line; do
              printf '::error title=Build (Fedora %s)::%s\n' "${{ matrix.fedora }}" "${line//%/%25}"
            done
            exit 1
          fi
      - name: Qt process and native result tests
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          if ! ctest --test-dir build --output-on-failure --timeout 180 2>&1 | tee ctest.log; then
            grep -E "FAIL!|Loc: |Actual|Expected|AssertionError|Error|failed|Timeout|\\*\\*\\*" ctest.log | head -n 40 | while IFS= read -r line; do
              printf '::error title=Tests (Fedora %s)::%s\n' "${{ matrix.fedora }}" "${line//%/%25}"
            done
            exit 1
          fi
      - name: Install and load every QML page offscreen
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build
          export XDG_CURRENT_DESKTOP=KDE QT_FORCE_STDERR_LOGGING=1 QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=org.kde.desktop
          if ! dbus-run-session -- timeout 30 /usr/bin/fe-xico-updater --qml-smoke-test 2>&1 | tee qml-smoke.log; then
            grep -E "qrc:|file:|QML|ReferenceError|TypeError|Binding loop|error" qml-smoke.log | grep -v "not placed in the graphics scene" | head -n 30 | while IFS= read -r line; do
              printf '::error title=QML smoke (Fedora %s)::%s\n' "${{ matrix.fedora }}" "${line//%/%25}"
            done
            exit 1
          fi
      - name: Missing configuration and untrusted XDG directory
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          mv /usr/etc/xdg/fe-xico-updater /tmp/saved-system-config
          mkdir -p /tmp/untrusted/fe-xico-updater
          printf '[Commands]\nsystemUpdateCommand=/does-not-exist\n' > /tmp/untrusted/fe-xico-updater/config.ini
          export XDG_CONFIG_DIRS=/tmp/untrusted
          export XDG_CURRENT_DESKTOP=KDE QT_FORCE_STDERR_LOGGING=1 QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=org.kde.desktop
          if ! dbus-run-session -- timeout 30 /usr/bin/fe-xico-updater --qml-smoke-test 2>&1 | tee qml-no-config.log; then
            grep -E "qrc:|file:|QML|ReferenceError|TypeError|Binding loop|error" qml-no-config.log | grep -v "not placed in the graphics scene" | head -n 30 | while IFS= read -r line; do
              printf '::error title=QML without config (Fedora %s)::%s\n' "${{ matrix.fedora }}" "${line//%/%25}"
            done
            exit 1
          fi
          mv /tmp/saved-system-config /usr/etc/xdg/fe-xico-updater
      # Screenshots of simulated states for design review. Every image carries a
      # "Simulated preview" footer; no update, check, rollback or restart runs.
      # Kept apart from rendering so a slow package download names itself.
      - name: Install preview fonts, icons and colour schemes
        id: preview_deps
        timeout-minutes: 8
        if: matrix.fedora == 45
        continue-on-error: true
        run: |
          dnf5 -y install --setopt=install_weak_deps=False --skip-unavailable \
            google-noto-sans-fonts google-noto-sans-mono-fonts terminus-fonts source-foundry-hack-fonts \
            breeze-icon-theme plasma-breeze-common
          ls /usr/share/color-schemes/ | sed 's/^/::notice title=Colour scheme::/' | head -n 4
      - name: Render simulated-state previews
        timeout-minutes: 8
        if: matrix.fedora == 45 && steps.preview_deps.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export XDG_CURRENT_DESKTOP=KDE QT_FORCE_STDERR_LOGGING=1 QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=org.kde.desktop
          status=0
          for variant in "dark::BreezeDark:" "dark-terminus::BreezeDark:Terminus" "light::BreezeLight:"; do
            IFS=':' read -r name _ scheme font <<<"$variant"
            mkdir -p "previews/$name"
            # timeout runs inside the D-Bus session so a stuck updater is itself killed
            # (killing dbus-run-session would leave it holding tee's pipe open).
            if ! FE_XICO_PREVIEW_COLOR_SCHEME="$scheme" FE_XICO_PREVIEW_FONT="$font" \
                dbus-run-session -- timeout -k 10 90 /usr/bin/fe-xico-updater --render-previews "previews/$name" 2>&1 | tee "previews/$name.log"; then
              printf '::warning title=Previews (%s)::Preview rendering did not complete (%s of 17 images); last output follows\n' \
                "$name" "$(find "previews/$name" -name '*.png' | wc -l)"
              tail -n 8 "previews/$name.log" | while IFS= read -r line; do
                line="${line//%/%25}"; printf '::warning title=Previews (%s) log::%s\n' "$name" "${line:0:400}"
              done
              status=1
              break
            fi
          done
          ls -R previews
          # The progress previews also go into the job log (base64 between markers),
          # so they can be reviewed where artifacts are not reachable.
          for image in previews/dark/06-dashboard-updating.png previews/dark/16-dashboard-downloading.png previews/dark/17-dashboard-deploying.png previews/light/16-dashboard-downloading.png; do
            [ -s "$image" ] || continue
            printf '@@FXIMG %s@@\n' "$(basename "$image" .png)"
            base64 -w 4000 "$image"
            printf '@@FXEND@@\n'
          done
          exit $status
      # Experiment: the progress bar does not appear in the offscreen previews
      # (also the indeterminate one). Render the progress scenarios again with the
      # Breeze widget style installed, offscreen and on a virtual X server, to see
      # which part of the preview environment is missing. Review aid only.
      - name: Progress bar rendering experiment
        timeout-minutes: 10
        if: matrix.fedora == 45 && steps.preview_deps.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          dnf5 -y install --setopt=install_weak_deps=False --skip-unavailable plasma-breeze xorg-x11-server-Xvfb >/dev/null
          rpm -q plasma-breeze xorg-x11-server-Xvfb | sed 's/^/::notice title=Experiment packages::/'
          export XDG_CURRENT_DESKTOP=KDE QT_FORCE_STDERR_LOGGING=1 QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=org.kde.desktop
          export FE_XICO_PREVIEW_COLOR_SCHEME=BreezeDark
          mkdir -p exp/offscreen-breeze exp/xvfb
          QT_QPA_PLATFORM=offscreen dbus-run-session -- timeout -k 10 90 /usr/bin/fe-xico-updater --render-previews exp/offscreen-breeze >exp/offscreen.log 2>&1
          Xvfb :91 -screen 0 1920x1200x24 >/dev/null 2>&1 & xpid=$!
          sleep 2
          DISPLAY=:91 QT_QPA_PLATFORM=xcb dbus-run-session -- timeout -k 10 90 /usr/bin/fe-xico-updater --render-previews exp/xvfb >exp/xvfb.log 2>&1
          kill "$xpid" 2>/dev/null
          for image in exp/offscreen-breeze/06-dashboard-updating.png exp/offscreen-breeze/16-dashboard-downloading.png \
                       exp/xvfb/06-dashboard-updating.png exp/xvfb/16-dashboard-downloading.png; do
            [ -s "$image" ] || { echo "::warning title=Experiment::missing $image"; continue; }
            printf '@@FXIMG %s@@\n' "$(echo "$image" | tr '/' '-')"
            base64 -w 4000 "$image"
            printf '@@FXEND@@\n'
          done
          grep -iE "style|progress|warning" exp/*.log | head -n 20 | sed 's/^/::notice title=Experiment log::/'
      - uses: actions/upload-artifact@v4
        if: always() && matrix.fedora == 45
        with:
          name: fe-xico-updater-previews
          path: previews/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-updater-test-logs-fedora-${{ matrix.fedora }}
          path: |
            build/Testing/Temporary/LastTest.log
            build.log
            ctest.log
            qml-*.log
